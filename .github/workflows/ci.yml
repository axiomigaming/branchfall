name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: causeway-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  causeway:
    name: Crash engine tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exact crash distribution (P(crash >= m) = 0.97/m), fairness vectors, the demo
      # authority's refusals and races, the controller's money bookkeeping, a whole-stack
      # RTP simulation, choreography purity and a route-generation soak.
      - name: Tests
        run: npm test

      # Also fails if the optimized assets are stale against the Blender exports.
      - name: Typecheck and production build
        run: npm run build
