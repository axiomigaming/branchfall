<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0E1114" />
    <title>BRANCHFALL — graybox</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E1114'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FFA53D'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      The shell. Every pixel of art in this build is generated here: the
      Understory, the branch, the Kindlings and their lanterns, the Lamp House
      and its door are drawn on a canvas, the surfaces are CSS, and the mix is
      synthesised in WebAudio — there is no downloaded asset of any kind. What is
      not drawn here is the information architecture, the flow, the copy and
      every number on the screen: those come from the server, which computes them
      from the engine.
    -->
    <div id="app" aria-live="polite"></div>
    <noscript>BRANCHFALL needs JavaScript. The round itself lives on the server.</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
